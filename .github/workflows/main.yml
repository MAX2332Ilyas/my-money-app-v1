name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./MyMoneyApp
        run: npm install

      - name: Capacitor Sync
        working-directory: ./MyMoneyApp
        # استعملنا اسم الحزمة الكامل باش npx ما يتلفش
        run: npx @capacitor/cli copy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build with Gradle
        working-directory: ./MyMoneyApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-money-app-apk
          path: MyMoneyApp/android/app/build/outputs/apk/debug/app-debug.apk
